name=WSOLED_Link
version=1.0.0
author=Daniele Degan <daniele.degan@gmail.com>
maintainer=Daniele Degan <daniele.degan@gmail.com>
sentence=Generic ESP-NOW communication layer (hub + node roles) for a camper sensor/actuator network.
paragraph=Built on the ESP32 core's bundled ESP_NOW/ESP_NOW_Peer C++ wrapper (not raw esp_now.h). Link_Init()/Link_OnMessage() are shared; Link_Node_* implements the battery/sensor node role (broadcasts HELLO until paired, then unicasts DATA); Link_Hub_* implements the hub role (pairing-mode-gated auto-accept of new nodes, in-RAM peer registry, Link_Hub_SendCommand() for actuator control). Generic link_message_t payload (protocol_version/msg_type/node_type/name/seq/battery_mv/value[3]) so new sensor/actuator types need no protocol changes. Peer registry is in-RAM only (no SD/NVS persistence yet).
category=Communication
url=https://github.com/DanieleDeGan/ESP32-S3_OLED_TOUCH
