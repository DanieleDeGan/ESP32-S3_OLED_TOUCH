author=Daniele Degan <daniele.degan@gmail.com>
maintainer=Daniele Degan <daniele.degan@gmail.com>
sentence=Onboard microSD (SDMMC 1-bit) of the Waveshare ESP32-S3-Touch-AMOLED-1.91, geared to text logging.
paragraph=SDCard_Init()/SDCard_AppendLine()/SDCard_WriteHeaderIfNew() wrap the core SD_MMC library with the board's V2 wiring (CLK=9, CMD=42, D0=8) fixed, retryable mounting and readable error strings. Uses no display pin, so it coexists with the QSPI panel and LVGL without locking.
category=Data Storage
